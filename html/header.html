<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>ТурТрек</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #f7f7f7;
      margin: 0;
      padding: 20px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #fff;
      padding: 10px 20px;
      border-bottom: 1px solid #ddd;
      margin-bottom: 20px;
    }

    .logo {
      font-weight: bold;
      font-style: italic;
      color: #007bff;
      border: 1px solid #007bff;
      border-radius: 20px;
      padding: 6px 16px;
      display: inline-block;
    }

    .nav {
      display: flex;
      gap: 20px;
    }

    .nav a {
      text-decoration: none;
      color: #2196f3;
      font-weight: 500;
    }

    .actions {
      display: flex;
      gap: 10px;
    }

    .btn {
      border: 1px solid #2196f3;
      background: none;
      padding: 6px 14px;
      border-radius: 6px;
      color: #2196f3;
      cursor: pointer;
      font-weight: 500;
    }

    .btn-primary {
      background-color: #2196f3;
      color: #fff;
    }

    .label {
      font-size: 12px;
      color: #aaa;
      margin: 10px 0 5px;
    }
  </style>
</head>
<body>

  <!-- Header: гость -->
  <div class="label">шапка гостя</div>
  <header class="header">
    <div class="logo">ТурТрек</div>
    <nav class="nav">
      <a href="#">Участники</a>
      <a href="#">Даты соревнований</a>
      <a href="#">Победители</a>
    </nav>
    <div class="actions">
      <button class="btn btn-primary">Вход</button>
      <button class="btn">Регистрация</button>
    </div>
  </header>

  <!-- Header: пользователь -->
  <div class="label">шапка пользователя</div>
  <header class="header">
    <div class="logo">ТурТрек</div>
    <nav class="nav">
      <a href="#">Участники</a>
      <a href="#">Даты соревнований</a>
      <a href="#">Победители</a>
    </nav>
    <div class="actions">
      <button class="btn">Профиль</button>
      <button class="btn">Выход</button>
    </div>
  </header>

  <!-- Header: админ -->
  <div class="label">шапка админа</div>
  <header class="header">
    <div class="logo">ТурТрек</div>
    <nav class="nav">
      <a href="#">Проведение</a>
      <a href="#">Участники</a>
      <a href="#">Даты соревнований</a>
      <a href="#">Победители</a>
    </nav>
    <div class="actions">
      <button class="btn">Профиль</button>
      <button class="btn">Выход</button>
    </div>
  </header>

</body>
</html>
