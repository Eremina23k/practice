<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Список участников — ТурТрек</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #d7edff;
    }

    header {
      background-color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 30px;
    }

    .logo {
      background-color: #e5f3ff;
      color: #2c8eff;
      font-weight: bold;
      padding: 6px 12px;
      border-radius: 6px;
    }

    nav a {
      margin: 0 15px;
      text-decoration: none;
      color: #2c8eff;
      font-weight: 500;
    }

    .auth-buttons button {
      padding: 6px 14px;
      border: 1px solid #2c8eff;
      background-color: white;
      color: #2c8eff;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
    }

    .auth-buttons button:first-child {
      background-color: #2c8eff;
      color: white;
    }

    h2 {
      text-align: center;
      color: #2c8eff;
      margin-top: 30px;
    }

    .table-container {
      max-width: 1000px;
      margin: 20px auto;
      background-color: white;
      border-radius: 12px;
      padding: 20px;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 15px;
    }

    select, input[type="text"] {
      padding: 8px;
      border-radius: 4px;
      border: 1px solid #ccc;
    }

    .filters label {
      font-weight: bold;
      color: #2c8eff;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: left;
    }

    th {
      background-color: #f0f0f0;
    }

    .search {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .search input {
      flex: 1;
    }

    @media (max-width: 768px) {
      .filters {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">ТурТрек</div>
    <nav>
      <a href="#">Участники</a>
      <a href="#">Даты соревнований</a>
      <a href="#">Победители</a>
    </nav>
    <div class="auth-buttons">
      <button onclick="location.href='login.html'">Вход</button>
      <button onclick="location.href='register.html'">Регистрация</button>
    </div>
  </header>

  <h2>Список участников</h2>

  <div class="table-container">
    <div class="filters">
      <label>Фильтры:</label>
      <select><option>Дата соревнований</option></select>
      <select><option>Пол</option></select>
      <select><option>Команда</option></select>
      <div class="search">
        <input type="text" placeholder="Поиск..." />
        <button>🔍</button>
      </div>
    </div>

    <table>
      <thead>
        <tr>
          <th>Фамилия</th>
          <th>Имя</th>
          <th>Пол</th>
          <th>Команда</th>
          <th>Дата</th>
        </tr>
      </thead>
      <tbody>
        <!-- Пример строк -->
        <tr>
          <td>Иванов</td>
          <td>Иван</td>
          <td>М</td>
          <td>Ветер</td>
          <td>22.07.2025</td>
        </tr>
      </tbody>
    </table>
  </div>
</body>
</html>
