<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Вход — ТурТрек</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #d7edff;
    }

    header {
      background-color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 30px;
    }

    .logo {
      background-color: #e5f3ff;
      color: #2c8eff;
      font-weight: bold;
      padding: 6px 12px;
      border-radius: 6px;
    }

    nav a {
      margin: 0 15px;
      text-decoration: none;
      color: #2c8eff;
      font-weight: 500;
    }

    .auth-buttons button {
      padding: 6px 14px;
      border: 1px solid #2c8eff;
      background-color: white;
      color: #2c8eff;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
    }

    .auth-buttons button:first-child {
      background-color: #2c8eff;
      color: white;
    }

    .form-container {
      background-color: white;
      padding: 30px;
      max-width: 350px;
      margin: 80px auto;
      border: 1px solid #9ed1f8;
    }

    h2 {
      margin-bottom: 20px;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    .form-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
    }

    .form-actions button {
      background-color: #2c8eff;
      color: white;
      padding: 8px 14px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    .form-actions a {
      font-size: 12px;
      color: #2c8eff;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">ТурТрек</div>
    <nav>
      <a href="#">Участники</a>
      <a href="#">Даты соревнований</a>
      <a href="#">Победители</a>
    </nav>
    <div class="auth-buttons">
      <button onclick="location.href='login.html'">Вход</button>
      <button onclick="location.href='register.html'">Регистрация</button>
    </div>
  </header>

  <div class="form-container">
    <h2>Вход</h2>
    <form>
      <input type="text" placeholder="Логин" required />
      <input type="password" placeholder="Пароль" required />
      <div class="form-actions">
        <button type="submit">Войти</button>
        <a href="register.html">зарегистрируйтесь</a>
      </div>
    </form>
  </div>
</body>
</html>
